services:
  brain-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vault:/data/brain
      - oauth:/data/oauth
      - ./deploy_key:/run/secrets/deploy_key:ro
    # Put an HTTPS reverse proxy in front of this port, serving BASE_URL
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"

volumes:
  vault:
  oauth:
