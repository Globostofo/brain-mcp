[project]
name = "brain-mcp"
version = "0.1.0"
description = "Remote MCP server that lets AI agents read and edit a git-backed Markdown notes vault"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
