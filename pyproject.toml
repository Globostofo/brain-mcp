[project]
name = "brain-mcp"
version = "0.1.0"
description = "Remote MCP server exposing the brain vault to claude.ai"
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
